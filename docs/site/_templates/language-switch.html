{% set language_root = pathto('index') | replace('index.html', '') | replace('#', '') %}
<nav class="language-switch" aria-label="Documentation language">
  {% if language == 'en' %}
  <a href="{{ language_root }}../{{ pagename }}.html" lang="zh-CN" hreflang="zh-CN">中文</a>
  <a href="{{ pathto(pagename) }}" lang="en" hreflang="en" aria-current="page">English</a>
  {% else %}
  <a href="{{ pathto(pagename) }}" lang="zh-CN" hreflang="zh-CN" aria-current="page">中文</a>
  <a href="{{ language_root }}en/{{ pagename }}.html" lang="en" hreflang="en">English</a>
  {% endif %}
</nav>
