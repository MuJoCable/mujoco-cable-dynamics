[project]
name = "mujoco-cable-dynamics"
version = "0.2.0"
description = "Unilateral surface-envelope cable dynamics plugin for MuJoCo"
requires-python = ">=3.10"
dependencies = ["mujoco>=3.4,<3.5", "numpy>=1.26", "pillow>=10"]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
