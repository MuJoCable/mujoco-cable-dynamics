name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip cmake ninja "mujoco==3.4.0" numpy pillow
      - name: Validate release tree
        run: python scripts/validate_release_tree.py
      - name: Configure
        shell: bash
        run: |
          MUJOCO_DIR="$(python -c 'import pathlib, mujoco; print(pathlib.Path(mujoco.__file__).resolve().parent)')"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMUJOCO_PYTHON_PACKAGE_DIR="$MUJOCO_DIR"
      - name: Build
        run: cmake --build build --config Release
      - name: Smoke test plugin
        shell: bash
        run: |
          PLUGIN="$(find build/plugin -type f \( -name 'libcable_unilateral.so' -o -name 'libcable_unilateral.dylib' \) | head -n 1)"
          python scripts/smoke_cpp_plugin.py \
            --plugin "$PLUGIN" \
            --model cable_plugin_demos/15_cpp_plugin_surface_single_pulley.xml \
            --steps 50
      - name: Python regression tests
        shell: bash
        run: |
          PLUGIN="$(find build/plugin -type f \( -name 'libcable_unilateral.so' -o -name 'libcable_unilateral.dylib' \) | head -n 1)"
          CABLE_PLUGIN_LIBRARY="$PLUGIN" PYTHONPATH=python python -m unittest discover tests
