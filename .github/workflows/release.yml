name: Publish binary release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime
        run: python -m pip install --upgrade pip cmake ninja "mujoco==3.4.0" numpy pillow
      - name: Validate release tree
        run: python scripts/validate_release_tree.py
      - name: Configure and build
        shell: bash
        run: |
          MUJOCO_DIR="$(python -c 'import pathlib, mujoco; print(pathlib.Path(mujoco.__file__).resolve().parent)')"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMUJOCO_PYTHON_PACKAGE_DIR="$MUJOCO_DIR"
          cmake --build build --config Release
      - name: Smoke test
        shell: bash
        run: |
          PLUGIN="$(find build/plugin -type f \( -name 'libcable_unilateral.so' -o -name 'libcable_unilateral.dylib' \) | head -n 1)"
          python scripts/smoke_cpp_plugin.py --plugin "$PLUGIN" --steps 50
      - name: Package
        shell: bash
        run: |
          PLUGIN="$(find build/plugin -type f \( -name 'libcable_unilateral.so' -o -name 'libcable_unilateral.dylib' \) | head -n 1)"
          chmod +x scripts/package_release.sh scripts/run_demo.sh
          scripts/package_release.sh "$PLUGIN" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}-${{ runner.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
