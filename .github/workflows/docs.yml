name: Technical documentation

on:
  push:
    branches: [main]
    paths: ['docs/site/**', 'examples/**', 'plugin/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/site/**', 'examples/**', 'plugin/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install documentation dependencies
        run: python -m pip install -r docs/site/requirements.txt
      - name: Build and check documentation
        run: python docs/site/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: mujocable-technical-manual
          path: docs/site/_build/html
          include-hidden-files: true
